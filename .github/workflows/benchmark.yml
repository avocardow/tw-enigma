name: Performance Benchmarks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run benchmarks daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Type of benchmark to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - performance
          - memory
          - regression
      comparison_baseline:
        description: 'Compare against baseline (main branch)'
        required: false
        default: true
        type: boolean

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        node-version: [18, 20]
        benchmark-suite: [core, cli, integration]
    
    env:
      NODE_VERSION: ${{ matrix.node-version }}
      BENCHMARK_SUITE: ${{ matrix.benchmark-suite }}
      CI: true
      BENCHMARK_MODE: ci
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for baseline comparison
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build packages
        run: pnpm build
        
      - name: Setup benchmark environment
        run: |
          # Create benchmark results directory
          mkdir -p benchmark-results
          
          # Set up environment variables
          echo "BENCHMARK_OUTPUT_DIR=benchmark-results" >> $GITHUB_ENV
          echo "BENCHMARK_TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
          echo "BENCHMARK_COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "BENCHMARK_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          
          # Configure resource limits
          echo "NODE_OPTIONS=--max-old-space-size=4096" >> $GITHUB_ENV
          
      - name: Download baseline results
        if: github.event_name == 'pull_request' || inputs.comparison_baseline
        continue-on-error: true
        run: |
          # Download baseline benchmark results from main branch
          gh run download \
            --repo ${{ github.repository }} \
            --branch main \
            --name "benchmark-results-${{ matrix.node-version }}-${{ matrix.benchmark-suite }}" \
            --dir baseline-results || echo "No baseline found"
        env:
          GH_TOKEN: ${{ github.token }}
          
      - name: Run benchmark suite
        run: |
          # Run benchmarks with appropriate configuration
          case "${{ matrix.benchmark-suite }}" in
            core)
              pnpm test:benchmark:core \
                --reporter=json \
                --output-dir="$BENCHMARK_OUTPUT_DIR" \
                --baseline-dir="baseline-results" \
                --node-version="${{ matrix.node-version }}"
              ;;
            cli)
              pnpm test:benchmark:cli \
                --reporter=json \
                --output-dir="$BENCHMARK_OUTPUT_DIR" \
                --baseline-dir="baseline-results" \
                --node-version="${{ matrix.node-version }}"
              ;;
            integration)
              pnpm test:benchmark:integration \
                --reporter=json \
                --output-dir="$BENCHMARK_OUTPUT_DIR" \
                --baseline-dir="baseline-results" \
                --node-version="${{ matrix.node-version }}"
              ;;
            *)
              echo "Unknown benchmark suite: ${{ matrix.benchmark-suite }}"
              exit 1
              ;;
          esac
          
      - name: Generate benchmark report
        run: |
          # Generate HTML and markdown reports
          pnpm benchmark:report \
            --input="$BENCHMARK_OUTPUT_DIR" \
            --format=html,markdown,json \
            --include-charts \
            --compare-baseline
            
      - name: Check performance regression
        if: github.event_name == 'pull_request'
        run: |
          # Check for performance regressions
          pnpm benchmark:check-regression \
            --threshold=10 \
            --fail-on-regression=true \
            --input="$BENCHMARK_OUTPUT_DIR"
            
      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: benchmark-results-${{ matrix.node-version }}-${{ matrix.benchmark-suite }}
          path: |
            benchmark-results/
            **/*.benchmark.json
            **/*.benchmark.html
            **/*.benchmark.md
          retention-days: 30
          
      - name: Upload performance report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: performance-report-${{ matrix.node-version }}-${{ matrix.benchmark-suite }}
          path: |
            benchmark-results/*.html
            benchmark-results/*.md
          retention-days: 7
          
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              // Read benchmark summary
              const summaryPath = path.join('benchmark-results', 'summary.json');
              if (fs.existsSync(summaryPath)) {
                const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
                
                // Format results for PR comment
                const results = `
            ## 📊 Performance Benchmark Results
            
            **Node.js ${matrix.node-version}** | **${matrix.benchmark-suite}** suite
            
            | Metric | Current | Baseline | Change |
            |--------|---------|----------|--------|
            | Duration | ${summary.avgTime?.toFixed(2)}ms | ${summary.baselineAvgTime?.toFixed(2)}ms | ${summary.performanceChange > 0 ? '🔴' : '🟢'} ${summary.performanceChange?.toFixed(1)}% |
            | Memory | ${(summary.avgMemory / 1024 / 1024)?.toFixed(2)}MB | ${(summary.baselineAvgMemory / 1024 / 1024)?.toFixed(2)}MB | ${summary.memoryChange > 0 ? '🔴' : '🟢'} ${summary.memoryChange?.toFixed(1)}% |
            | Success Rate | ${((summary.successful / summary.total) * 100)?.toFixed(1)}% | ${((summary.baselineSuccessful / summary.baselineTotal) * 100)?.toFixed(1)}% | ${summary.successChange > 0 ? '🟢' : '🔴'} ${summary.successChange?.toFixed(1)}% |
            
            ${summary.regressions?.length > 0 ? `
            ### ⚠️ Performance Regressions Detected
            ${summary.regressions.map(r => `- **${r.test}**: ${r.change}% slower`).join('\n')}
            ` : '✅ No performance regressions detected'}
            
            <details>
            <summary>📈 View detailed results</summary>
            
            - **Total Tests**: ${summary.total}
            - **Successful**: ${summary.successful}
            - **Failed**: ${summary.failed}
            - **Fastest Test**: ${summary.fastest?.name} (${summary.fastest?.duration}ms)
            - **Slowest Test**: ${summary.slowest?.name} (${summary.slowest?.duration}ms)
            
            [📋 Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            </details>
            `;
                
                // Post comment
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: results
                });
              }
            } catch (error) {
              console.log('Could not post benchmark results:', error.message);
            }
            
      - name: Store benchmark data
        if: github.ref == 'refs/heads/main'
        run: |
          # Store benchmark results for future baseline comparisons
          echo "Storing benchmark data for future baselines"
          
          # Upload to benchmark storage (could be S3, GitHub Pages, etc.)
          # This would depend on your storage strategy
          
  benchmark-comparison:
    name: Benchmark Comparison Report
    runs-on: ubuntu-latest
    needs: benchmark
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'schedule')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          path: all-results/
          merge-multiple: true
          
      - name: Generate comprehensive report
        run: |
          # Generate comprehensive comparison report
          pnpm benchmark:compare \
            --input-dir="all-results" \
            --output="benchmark-comparison-report.html" \
            --format=html \
            --include-charts \
            --group-by=node-version,suite
            
      - name: Upload comparison report
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-comparison-report
          path: benchmark-comparison-report.html
          retention-days: 30
          
  benchmark-alert:
    name: Performance Alert
    runs-on: ubuntu-latest
    needs: benchmark
    if: failure() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Send performance alert
        uses: actions/github-script@v7
        with:
          script: |
            // Create an issue for performance regression on main branch
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Performance Regression Detected - ${new Date().toISOString().split('T')[0]}`,
              body: `
            ## Performance Regression Alert
            
            A performance regression has been detected in the main branch.
            
            **Details:**
            - **Commit**: ${context.sha}
            - **Workflow**: [${context.workflow}](${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            - **Detected**: ${new Date().toISOString()}
            
            **Next Steps:**
            1. Review the benchmark results in the failed workflow
            2. Identify the commit that introduced the regression
            3. Investigate and fix the performance issue
            4. Re-run benchmarks to verify the fix
            
            This issue will be automatically closed when benchmarks pass again.
            `,
              labels: ['performance', 'regression', 'urgent']
            });