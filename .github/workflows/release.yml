# TW-Enigma Release Automation
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      prerelease_identifier:
        description: 'Prerelease identifier (alpha, beta, rc)'
        required: false
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - rc

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.10.0'
  CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel releases

jobs:
  # ========================================
  # Version Calculation & Preparation
  # ========================================
  prepare-release:
    name: 🔢 Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should-release: ${{ steps.check-changes.outputs.should-release }}
      new-version: ${{ steps.version.outputs.new-version }}
      release-notes: ${{ steps.release-notes.outputs.notes }}
      release-type: ${{ steps.detect-type.outputs.release-type }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changesets
        id: check-changes
        run: |
          echo "🔍 Checking for pending changesets..."
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "Manual release triggered"
          else
            # Check if there are changesets to release
            pnpm changeset status --output=status.json
            
            if jq -e '.releases | length > 0' status.json > /dev/null; then
              echo "should-release=true" >> $GITHUB_OUTPUT
              echo "✅ Changes detected for release"
            else
              echo "should-release=false" >> $GITHUB_OUTPUT
              echo "ℹ️ No changes to release"
            fi
          fi

      - name: Detect release type
        id: detect-type
        if: steps.check-changes.outputs.should-release == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TYPE="${{ github.event.inputs.release_type }}"
            PRERELEASE_ID="${{ github.event.inputs.prerelease_identifier }}"
            
            if [ "$RELEASE_TYPE" = "prerelease" ]; then
              echo "release-type=prerelease-${PRERELEASE_ID}" >> $GITHUB_OUTPUT
            else
              echo "release-type=${RELEASE_TYPE}" >> $GITHUB_OUTPUT
            fi
          else
            # Auto-detect from changesets
            echo "release-type=auto" >> $GITHUB_OUTPUT
          fi

      - name: Calculate new version
        id: version
        if: steps.check-changes.outputs.should-release == 'true'
        run: |
          echo "📊 Calculating new version..."
          
          if [ "${{ steps.detect-type.outputs.release-type }}" = "auto" ]; then
            # Use changeset to determine version
            pnpm changeset version --snapshot
            NEW_VERSION=$(jq -r '.version' package.json)
          else
            # Manual version bump
            CURRENT_VERSION=$(jq -r '.version' package.json)
            RELEASE_TYPE="${{ steps.detect-type.outputs.release-type }}"
            
            # Use npm semver for version bumping
            case "$RELEASE_TYPE" in
              "patch")
                NEW_VERSION=$(npm version patch --no-git-tag-version | sed 's/v//')
                ;;
              "minor")
                NEW_VERSION=$(npm version minor --no-git-tag-version | sed 's/v//')
                ;;
              "major")
                NEW_VERSION=$(npm version major --no-git-tag-version | sed 's/v//')
                ;;
              prerelease-*)
                PRERELEASE_ID=$(echo "$RELEASE_TYPE" | cut -d'-' -f2)
                NEW_VERSION=$(npm version prerelease --preid=$PRERELEASE_ID --no-git-tag-version | sed 's/v//')
                ;;
              *)
                NEW_VERSION="$CURRENT_VERSION"
                ;;
            esac
          fi
          
          echo "new-version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "🎯 New version will be: ${NEW_VERSION}"

      - name: Generate release notes
        id: release-notes
        if: steps.check-changes.outputs.should-release == 'true'
        run: |
          echo "📝 Generating release notes..."
          
          # Generate changelog since last release
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "HEAD~20")
          
          echo "## 🚀 What's Changed" > release-notes.md
          echo "" >> release-notes.md
          
          # Get commits since last tag
          git log --pretty=format:"- %s" ${LAST_TAG}..HEAD --no-merges >> release-notes.md
          
          # Set output (handle multiline)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ========================================
  # Quality Gates for Release
  # ========================================
  quality-gate:
    name: 🚦 Quality Gate
    runs-on: ubuntu-latest
    needs: prepare-release
    if: needs.prepare-release.outputs.should-release == 'true'
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite
        run: |
          echo "🧪 Running comprehensive test suite..."
          pnpm test:ci
          echo "✅ All tests passed"

      - name: Run benchmarks for release validation
        run: |
          echo "⚡ Running performance validation..."
          pnpm benchmark:ci --threshold 5 --output ./release-benchmarks
          echo "✅ Performance validation passed"

      - name: Security audit
        run: |
          echo "🔒 Running security audit..."
          pnpm audit --audit-level moderate
          echo "✅ Security audit passed"

      - name: Build packages
        run: |
          echo "🏗️ Building packages for release..."
          pnpm build
          echo "✅ Build completed successfully"

  # ========================================
  # Release Execution
  # ========================================
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [prepare-release, quality-gate]
    if: needs.prepare-release.outputs.should-release == 'true'
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Version packages
        run: |
          echo "🔢 Updating package versions..."
          
          if [ "${{ needs.prepare-release.outputs.release-type }}" = "auto" ]; then
            # Use changesets for versioning
            pnpm changeset version
          else
            # Manual version update
            NEW_VERSION="${{ needs.prepare-release.outputs.new-version }}"
            
            # Update workspace packages
            jq ".version = \"$NEW_VERSION\"" packages/core/package.json > packages/core/package.json.tmp && mv packages/core/package.json.tmp packages/core/package.json
            jq ".version = \"$NEW_VERSION\"" packages/cli/package.json > packages/cli/package.json.tmp && mv packages/cli/package.json.tmp packages/cli/package.json
          fi

      - name: Commit version changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add -A
          git commit -m "chore: release v${{ needs.prepare-release.outputs.new-version }}" || echo "No changes to commit"

      - name: Create Git tag
        run: |
          NEW_VERSION="${{ needs.prepare-release.outputs.new-version }}"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"

      - name: Publish to NPM
        run: |
          echo "📦 Publishing to NPM..."
          
          # Set registry authentication
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          
          # Publish packages
          pnpm publish -r --access public --no-git-checks
          
          echo "✅ Packages published successfully"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push changes and tags
        run: |
          git push origin main
          git push origin --tags

      - name: Create GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.prepare-release.outputs.new-version }}
          release_name: Release v${{ needs.prepare-release.outputs.new-version }}
          body: ${{ needs.prepare-release.outputs.release-notes }}
          draft: false
          prerelease: ${{ contains(needs.prepare-release.outputs.release-type, 'prerelease') }}

      - name: Notify success
        run: |
          echo "🎉 Release v${{ needs.prepare-release.outputs.new-version }} completed successfully!"
          echo "📦 Packages published to NPM"
          echo "🏷️ GitHub release created"