name: CI (Enhanced)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  PNPM_CACHE_FOLDER: .pnpm
  HUSKY: 0

jobs:
  # Job 1: Install dependencies and setup caches
  install:
    name: Install & Cache Setup
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-deps.outputs.cache-hit }}
      pnpm-version: ${{ steps.pnpm-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Get pnpm version
        id: pnpm-version
        run: echo "version=$(pnpm --version)" >> $GITHUB_OUTPUT

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ steps.pnpm-version.outputs.version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-${{ steps.pnpm-version.outputs.version }}-
            ${{ runner.os }}-pnpm-store-
          enableCrossOsArchive: false
          save-always: true

      - name: Setup node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ steps.pnpm-version.outputs.version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ steps.pnpm-version.outputs.version }}-
          save-always: true

      - name: Setup TypeScript cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/tsconfig.tsbuildinfo
            node_modules/.cache/typescript/**
          key: ${{ runner.os }}-typescript-${{ hashFiles('**/tsconfig.json', '**/tsconfig.base.json', 'packages/*/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-typescript-

      - name: Setup ESLint cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/eslint/**
            .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('.eslintrc.js', '**/eslint.config.*', 'packages/*/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Setup Vitest cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/vitest/**
            packages/*/node_modules/.cache/vitest/**
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/vitest.config.*', '**/vitest.workspace.*') }}
          restore-keys: |
            ${{ runner.os }}-vitest-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # Job 2: Lint and format check
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: install
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-
            ${{ runner.os }}-node-modules-

      - name: Install dependencies if cache miss
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/eslint/**
            .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('.eslintrc.js', '**/eslint.config.*', 'packages/*/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Run ESLint
        run: pnpm turbo lint

      - name: Check Prettier formatting
        run: pnpm turbo format:check

  # Job 3: Type checking
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: install
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Restore node_modules
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-
            ${{ runner.os }}-node-modules-

      - name: Install dependencies if cache miss
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore TypeScript cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/tsconfig.tsbuildinfo
            node_modules/.cache/typescript/**
          key: ${{ runner.os }}-typescript-${{ hashFiles('**/tsconfig.json', '**/tsconfig.base.json', 'packages/*/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-typescript-

      - name: Run TypeScript type checking
        run: pnpm turbo type-check

  # Job 4: Build packages
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [install, lint, type-check]
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Restore node_modules
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-
            ${{ runner.os }}-node-modules-

      - name: Install dependencies if cache miss
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore TypeScript cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/tsconfig.tsbuildinfo
            node_modules/.cache/typescript/**
          key: ${{ runner.os }}-typescript-${{ hashFiles('**/tsconfig.json', '**/tsconfig.base.json', 'packages/*/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-typescript-

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}-${{ matrix.node-version }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ matrix.node-version }}-
            ${{ runner.os }}-turbo-main-${{ matrix.node-version }}-
            ${{ runner.os }}-turbo-${{ matrix.node-version }}-
            ${{ runner.os }}-turbo-

      - name: Build packages
        run: pnpm turbo build

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            packages/*/build
          key: ${{ runner.os }}-build-${{ github.sha }}-${{ matrix.node-version }}
          save-always: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.node-version }}
          path: |
            packages/*/dist
            packages/*/build
          retention-days: 7
          compression-level: 6

  # Job 5: Run tests
  test:
    name: Test Suites
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
        test-type: ['unit', 'integration']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Restore node_modules
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-
            ${{ runner.os }}-node-modules-

      - name: Install dependencies if cache miss
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore build artifacts
        uses: actions/cache@v4
        id: cache-build
        with:
          path: |
            packages/*/dist
            packages/*/build
          key: ${{ runner.os }}-build-${{ github.sha }}-${{ matrix.node-version }}
          restore-keys: |
            ${{ runner.os }}-build-${{ github.ref_name }}-${{ matrix.node-version }}-
            ${{ runner.os }}-build-main-${{ matrix.node-version }}-

      - name: Build packages if cache miss
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: pnpm turbo build

      - name: Restore Vitest cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/vitest/**
            packages/*/node_modules/.cache/vitest/**
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/vitest.config.*', '**/vitest.workspace.*') }}
          restore-keys: |
            ${{ runner.os }}-vitest-

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}-${{ matrix.node-version }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ matrix.node-version }}-
            ${{ runner.os }}-turbo-main-${{ matrix.node-version }}-
            ${{ runner.os }}-turbo-${{ matrix.node-version }}-
            ${{ runner.os }}-turbo-

      - name: Run unit tests
        if: matrix.test-type == 'unit'
        run: pnpm turbo test:unit

      - name: Run integration tests
        if: matrix.test-type == 'integration'
        run: pnpm turbo test:integration

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.node-version }}-${{ matrix.test-type }}
          path: |
            packages/*/coverage
            packages/*/test-results.xml
          retention-days: 7

  # Job 6: End-to-end tests
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      matrix:
        node-version: ['20.x'] # Only run E2E on latest stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Restore node_modules
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-
            ${{ runner.os }}-node-modules-

      - name: Install dependencies if cache miss
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore build artifacts
        uses: actions/cache@v4
        id: cache-build
        with:
          path: |
            packages/*/dist
            packages/*/build
          key: ${{ runner.os }}-build-${{ github.sha }}-${{ matrix.node-version }}
          restore-keys: |
            ${{ runner.os }}-build-${{ github.sha }}-
            ${{ runner.os }}-build-

      - name: Build packages if cache miss
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: pnpm turbo build

      - name: Run E2E tests
        run: pnpm turbo test:e2e

  # Job 7: Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Restore node_modules
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-
            ${{ runner.os }}-node-modules-

      - name: Install dependencies if cache miss
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate

      - name: Run license check
        run: pnpm turbo license-check || true # Non-blocking for now

  # Job 8: Performance benchmarks (optional, on main branch only)
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Restore node_modules
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ needs.install.outputs.pnpm-version }}-
            ${{ runner.os }}-node-modules-

      - name: Install dependencies if cache miss
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore build artifacts
        uses: actions/cache@v4
        id: cache-build
        with:
          path: |
            packages/*/dist
            packages/*/build
          key: ${{ runner.os }}-build-${{ github.sha }}-20.x
          restore-keys: |
            ${{ runner.os }}-build-${{ github.sha }}-
            ${{ runner.os }}-build-

      - name: Build packages if cache miss
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: pnpm turbo build

      - name: Run performance benchmarks
        run: pnpm turbo benchmark || true # Non-blocking for now

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 30

  # Job 9: Cache metrics and validation summary
  validate:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, build, test, security]
    if: always()
    steps:
      - name: Print cache metrics
        run: |
          echo "## 📊 CI Pipeline Cache Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Cache Strategy |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|----------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | ✅ | pnpm store + node_modules |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ✅ | tsbuildinfo + compiler cache |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint | ✅ | eslint cache + results |" >> $GITHUB_STEP_SUMMARY
          echo "| Vitest | ✅ | test cache + results |" >> $GITHUB_STEP_SUMMARY
          echo "| Turborepo | ✅ | build cache + artifacts |" >> $GITHUB_STEP_SUMMARY

      - name: Check job results
        run: |
          echo "## 🔍 Job Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.type-check.result }}" == "failure" || "${{ needs.build.result }}" == "failure" || "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ CI pipeline failed"
            exit 1
          else
            echo "✅ CI pipeline passed"
          fi
